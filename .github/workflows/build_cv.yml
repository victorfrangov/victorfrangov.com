name: Build CVs

on:
  push:
    branches:
      - main
    paths:
      - 'data/cv_en.yaml'
      - 'data/cv_fr.yaml'
      - '.github/workflows/build_cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install RenderCV
        run: |
          pip install --upgrade "rendercv[full]" "click>=8,<9"

      - name: Build PDFs (RenderCV)
        run: |
          rendercv render data/cv_en.yaml --pdf-path public/cv_en.pdf
          rendercv render data/cv_fr.yaml --pdf-path public/cv_fr.pdf
          rm -rf rendercv_output

      - name: Commit and Push PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cv_en.pdf public/cv_fr.pdf
          if git diff --staged --quiet; then
            echo "No changes in generated CV PDFs."
          else
            git commit -m "chore(cv): auto-render CV PDFs [skip ci]"
            git push origin main
          fi